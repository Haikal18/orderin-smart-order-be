name: CI/CD Pipeline Laravel API

on:
  push:
    branches: ["stagging"]
  pull_request:
    branches: ["stagging"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: orderin-app
  HOST_PORT: 9090

jobs:
  # Job 1: Build dan Push Image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.lowercase.outputs.image }}
    
    steps:
      # 0. Convert repository name to lowercase
      - name: 🔤 Convert repository name to lowercase
        id: lowercase
        run: |
          echo "image=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      # 1. Checkout kode dari repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login ke GitHub Container Registry
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata (tags, labels) for Docker
      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
            type=ref,event=branch
          flavor: |
            latest=auto

      # 5. Build and push Docker image
      - name: 🏗️ Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false

      # 6. Output image info
      - name: 📊 Output image information
        run: |
          echo "### 🚀 Docker Image Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.lowercase.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Job 2: Deploy ke Self-Hosted Runner
  deploy-to-server:
    name: Deploy to Self-Hosted Server
    needs: build-and-push
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/stagging'
    
    steps:
      # 1. Checkout repository untuk akses docker-compose.yml
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 1.5 Check if host port 80 is free on the self-hosted runner
      - name: ⚠️ Ensure host-port availability (stop existing orderin if needed)
        run: |
          echo "Checking if host port $HOST_PORT is available on runner..."
          if ss -tuln | grep -q ":${HOST_PORT}\b"; then
            echo "Port ${HOST_PORT} is in use. Verifying running containers..."

            # if the port is used by an existing orderin-nginx container, stop & remove it so deployment can continue
            if docker ps --filter "name=orderin-nginx" --format '{{.ID}}' | grep -q .; then
              echo "Found existing 'orderin-nginx' container — stopping and removing it..."
              docker stop orderin-nginx || true
              docker rm orderin-nginx || true
              echo "Stopped existing orderin containers and freed port ${HOST_PORT}."
            else
              echo "Port ${HOST_PORT} is used by a different process — aborting deployment." >&2
              ss -tuln | grep ":${HOST_PORT}\b" >&2 || true
              exit 1
            fi
          else
            echo "Port ${HOST_PORT} is free. Proceeding..."
          fi

      # 2. Login to GHCR untuk pull image
      - name: 🔐 Login to GHCR
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # 3. Pull latest image from GHCR
      - name: 🔄 Pull stagging image from GHCR
        run: |
          docker pull ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image-name }}:stagging

      # 4. Deploy menggunakan docker-compose
      - name: 🚀 Deploy with docker-compose
        env:
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image-name }}:stagging
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_DEBUG: ${{ secrets.APP_DEBUG }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
        run: |
          docker compose down || true
          docker compose up -d

      # 5. Wait for container to be healthy
      - name: ⏳ Wait for container to be ready
        run: |
          echo "Waiting for containers to start..."
          sleep 10
          
          # Check if containers are running
          if [ $(docker ps -q -f name=orderin-app) ]; then
            echo "✅ App container is running!"
          else
            echo "❌ App container failed to start!"
            docker logs orderin-app
            exit 1
          fi
          
          if [ $(docker ps -q -f name=orderin-nginx) ]; then
            echo "✅ Nginx container is running!"
          else
            echo "❌ Nginx container failed to start!"
            docker logs orderin-nginx
            exit 1
          fi

      # 6. Run database migrations
      - name: 🗄️ Run database migrations
        run: |
          docker compose exec -T app php artisan migrate --force

      # 7. Clear and optimize caches
      - name: 🔄 Clear and optimize caches
        run: |
          docker compose exec -T app php artisan config:cache
          docker compose exec -T app php artisan route:cache
          docker compose exec -T app php artisan view:cache

      # 8. Verify deployment
      - name: ✅ Verify deployment
        run: |
          echo "### ✨ Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Container Status:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker ps -f name=orderin --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # 9. Cleanup old images
      - name: 🧹 Cleanup old images
        run: |
          echo "Removing unused images..."
          docker image prune -f
